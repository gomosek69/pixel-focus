<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Pixel Focus</title>
  <!-- Библиотека Telegram Mini Apps. В обычном браузере приложение работает и без неё. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Минимум оформления, пока грузятся стили приложения */
    body { margin: 0; background: var(--tg-theme-secondary-bg-color, #f2f3f7); color: var(--tg-theme-hint-color, #8a8f98);
      font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: var(--tg-theme-secondary-bg-color, #0e1014); } }
    .loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="loading" class="loading">…</div>
  <div id="app" hidden>
    <main id="screen"></main>
    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <!--
    Этот файл больше не нужно менять при обновлениях.
    Он всегда загружает свежий loader.js (метка времени в адресе не даёт взять старую копию),
    а уже loader.js знает номер версии и список файлов приложения.
  -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'loader.js?t=' + Date.now();
      s.onerror = function () {
        document.getElementById('loading').textContent =
          'Не удалось загрузить приложение. Проверьте интернет. / Failed to load. Check your connection.';
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
